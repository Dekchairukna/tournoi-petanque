<!doctype html>
<html lang="{{ board_settings.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Live Board</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/live_board.css') }}">
</head>
<body>
<div class="board" id="board" data-theme="{{ board_settings.theme }}" data-font="{{ board_settings.font }}" data-kku="{{ 'true' if is_kku else 'false' }}">
  <header class="bar">
    <div class="brand">
      {% if is_kku %}<img class="brand-logo" src="{{ url_for('static', filename='live_board/kku_logo_real.png') }}" alt="KKU 2026">
      {% elif event_logo %}<img class="brand-logo" src="{{ event_logo }}" alt="">{% endif %}
      <div class="titles">
        <div class="title" id="boardTitle">Live Board</div>
        <div class="sub" id="boardSub"></div>
      </div>
    </div>
    <div class="timers" id="timerChips" aria-live="polite"></div>
    <div class="actions">
      {% if controllable_ids %}<button type="button" class="btn btn-primary" id="quickTimer" hidden></button>{% endif %}
      <button type="button" class="btn btn-ghost" id="openSettings" data-label="settings"></button>
    </div>
  </header>

  <main class="table-area">
    <div class="cols" id="cols"></div>
    <div class="empty" id="emptyState" hidden></div>
  </main>

  <footer class="foot">
    <span class="conn" id="conn"><i class="dot"></i><span id="connText"></span></span>
    <span class="waiting" id="waitingNote"></span>
    {% if is_kku %}<img class="org-strip" src="{{ url_for('static', filename='live_board/org_strip_real.png') }}" alt="Official organizations">{% endif %}
    <span class="page" id="pageBadge"></span>
  </footer>
</div>

{% if controllable_ids %}
<dialog class="panel" id="timerDialog">
  <form method="dialog" class="panel-body" id="timerForm">
    <h2 data-label="timerTitle"></h2>
    <p class="hint" data-label="timerHint"></p>
    <div class="timer-events" id="timerEvents"></div>
    <div class="time-inputs">
      <label><span data-label="minutes"></span><input type="number" id="timerMinutes" min="0" max="1440" value="60" inputmode="numeric"></label>
      <label><span data-label="seconds"></span><input type="number" id="timerSeconds" min="0" max="59" value="0" inputmode="numeric"></label>
    </div>
    <div class="timer-buttons">
      <button type="button" class="btn btn-primary" data-timer-action="start" data-label="start"></button>
      <button type="button" class="btn" data-timer-action="pause" data-label="pause"></button>
      <button type="button" class="btn" data-timer-action="resume" data-label="resume"></button>
      <button type="button" class="btn" data-timer-action="set" data-label="set"></button>
      <button type="button" class="btn btn-danger" data-timer-action="reset" data-label="reset"></button>
    </div>
    <div class="notice" id="timerNotice" role="status"></div>
    <div class="panel-actions"><button class="btn btn-ghost" value="close" data-label="close"></button></div>
  </form>
</dialog>
{% endif %}

<dialog class="panel" id="settingsDialog">
  <form method="dialog" class="panel-body" id="settingsForm">
    <h2 data-label="settingsTitle"></h2>
    <p class="hint" data-label="settingsHint"></p>
    <fieldset class="themes">
      <legend data-label="theme"></legend>
      {% for t in board_options.themes %}
      <label class="theme-option" data-theme-preview="{{ t }}">
        <input type="radio" name="theme" value="{{ t }}">
        <span class="swatch"><i></i><i></i><i></i></span>
        <span data-label="theme_{{ t }}"></span>
      </label>
      {% endfor %}
    </fieldset>
    <div class="settings-grid">
      <label><span data-label="perPage"></span>
        <select name="per_page">{% for n in board_options.per_page %}<option value="{{ n }}">{{ n }}</option>{% endfor %}</select></label>
      <label><span data-label="fontSize"></span>
        <select name="font">{% for f in board_options.fonts %}<option value="{{ f }}" data-label="font_{{ f }}"></option>{% endfor %}</select></label>
      <label><span data-label="pages"></span>
        <select name="pages">{% for n in range(1,13) %}<option value="{{ n }}">{{ n }}</option>{% endfor %}</select></label>
      <label><span data-label="interval"></span>
        <select name="interval">{% for n in [5,8,10,15,20,30] %}<option value="{{ n }}">{{ n }}s</option>{% endfor %}</select></label>
      <label><span data-label="language"></span>
        <select name="lang"><option value="th">ไทย</option><option value="en">English</option></select></label>
    </div>
    <label class="share"><span data-label="shareLink"></span><input type="text" id="shareLink" readonly></label>
    <div class="panel-actions">
      <button type="button" class="btn btn-ghost" id="cancelSettings" data-label="cancel"></button>
      <button type="button" class="btn btn-primary" id="applySettings" data-label="apply"></button>
    </div>
  </form>
</dialog>

<script>
window.LIVE_BOARD_CONFIG = {
  selected: {{ selected_event_ids|tojson }},
  pages: {{ page_count|int }},
  interval: {{ rotate_interval|int }},
  settings: {{ board_settings|tojson }},
  controllable: {{ controllable_ids|tojson }},
  isKku: {{ 'true' if is_kku else 'false' }}
};
</script>
<script src="{{ url_for('static', filename='js/live_board.js') }}"></script>
</body>
</html>
